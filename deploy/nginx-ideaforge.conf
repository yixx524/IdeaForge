# Nginx 站点配置（学习部署用，HTTP 即可）
# 安装：sudo cp nginx-ideaforge.conf /etc/nginx/sites-available/ideaforge
#       sudo ln -sf /etc/nginx/sites-available/ideaforge /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # 学习阶段用 IP 访问，有域名再改

    root /var/www/ideaforge;
    index index.html;

    # 前端 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（SSE 流式整理需关闭缓冲）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
